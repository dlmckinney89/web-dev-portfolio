<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Box Model Practice</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
    }

    h1, h2 {
      text-align: center;      /* centers the text in the h1 and h2 */
    }

    header {
      padding: 20px;
    }

    section {
      width: 400px;            /* width */
      margin: 30px auto;       /* auto centers the box; 30px space above and below each */
      padding: 20px;           /* inner space around the content */
      border: 3px solid #333;  /* visible edges */
    }
  </style>
</head>
<body>

  <header>
    <h1>Box Model Practice</h1>
  </header>

  <section>
    <h2>This is box 1</h2>
    <p>There is content here.</p>
  </section>

  <section>
    <h2>This is box 2</h2>
    <p>There is more content here.</p>
  </section>

</body>
</html>
